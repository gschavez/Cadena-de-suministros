version: '3.8'

services:
  # Servicio de Base de Datos
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-compose
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Cambiar_Esta_Clave123
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - app-network

  # Servicio de la Aplicación Web
  web:
    image: cadena-suministros:v1
    container_name: app-compose
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Aquí usamos el nombre del servicio 'db' en lugar de 'localhost'
      - DB_CONNECTION_STRING=Server=db,1433;Database=CadenaSuministroDb;User Id=sa;Password=Cambiar_Esta_Clave123;TrustServerCertificate=True;
    depends_on:
      - db
    networks:
      - app-network

# Definimos la red para que se comuniquen
networks:
  app-network:
    driver: bridge

# Guardamos los datos de SQL Server para que no se borren al apagar
volumes:
  sqldata: